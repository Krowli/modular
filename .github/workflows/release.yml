name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v16.5.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, artifact: modular-darwin-arm64 }
          # darwin-x64 (Intel Mac) omitted: macos-13 CI runners build unreliably slow (>40m).
          # Intel Mac users install via `--source`; re-add with a reliable runner.
          - { os: ubuntu-latest, target: linux-x64, artifact: modular-linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, artifact: modular-linux-arm64 }
          - { os: windows-latest, target: win32-x64, artifact: modular-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addon
        run: bun run build:native

      - name: Build binary (${{ matrix.target }})
        shell: bash
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            bun scripts/ci-release-build-binaries.ts --targets=${{ matrix.target }} && exit 0
            n=$((n + 1))
            echo "::warning::build attempt $n failed (likely transient bun target download); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/coding-agent/binaries/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum modular-* | tee SHA256SUMS

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/modular-* dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/modular-* dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
